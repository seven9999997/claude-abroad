<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>出口</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;family=Noto+Sans+SC:wght@400;500;700;900&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#FBF7F2}
a{color:#2F6170}a:hover{color:#1F4F5B}
</style>
</helmet>
<div style="display: flex; flex-wrap: wrap; min-height: 100vh; background: #FBF7F2; font-family: Inter, 'Noto Sans SC', sans-serif; color: #2B2B2B">
<div style="flex: 1 1 232px; max-width: 100%; display: flex">
<dc-import name="Sidebar" active="exits" hint-size="100%,1000px"></dc-import>
</div>
<main style="flex: 999 1 560px; min-width: 0; box-sizing: border-box; padding: 32px 40px 48px; display: flex; flex-direction: column; gap: 24px">

<header style="display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 12px">
<div style="display: flex; flex-direction: column; gap: 6px">
<h1 style="margin: 0; font-size: 28px; font-weight: 800">分流出口 <span style="font-size: 16px; font-weight: 600; color: #5F564C">可选</span></h1>
<p style="margin: 0; font-size: 14px; color: #4A4239; max-width: 720px">只有在「应用分流」里指定了它的应用才走它；一个都不装，所有流量照样走<a href="MainProxy.dc.html">主代理</a>。分流出口失效时，指定它的应用会被拦截，不会悄悄改走主代理。</p>
</div>
<button type="button" style="min-height: 44px; padding: 0 18px; border-radius: 12px; border: 1.5px solid #2B2B2B; background: #FFFFFF; color: #2B2B2B; font: inherit; font-size: 14px; font-weight: 600; cursor: pointer">全部重新检查</button>
</header>

<section aria-labelledby="imp" style="padding: 20px; border-radius: 16px; background: #FFFFFF; border: 1px solid #E6DCCF; display: flex; flex-direction: column; gap: 16px">
<h2 id="imp" style="margin: 0; font-size: 16px; font-weight: 700">添加分流出口</h2>
<div role="tablist" aria-label="导入方式" style="display: flex; flex-wrap: wrap; gap: 8px">
<sc-for list="{{tabs}}" as="t" hint-placeholder-count="4">
<button type="button" role="tab" aria-selected="{{t.on}}" onClick="{{t.pick}}" style="{{t.style}}">{{t.label}}</button>
</sc-for>
</div>
<p style="margin: 0; font-size: 13px; color: #4A4239">{{tab.hint}}</p>
<div style="display: flex; flex-wrap: wrap; gap: 12px; align-items: flex-end">
<label style="flex: 1 1 160px; display: flex; flex-direction: column; gap: 6px; font-size: 13px; font-weight: 600">名称
<input type="text" placeholder="{{tab.namePh}}" style="min-height: 44px; box-sizing: border-box; padding: 0 12px; border-radius: 10px; border: 1px solid #CFC3B4; background: #FBF7F2; font: inherit; font-size: 14px; font-weight: 400">
</label>
<label style="flex: 4 1 320px; display: flex; flex-direction: column; gap: 6px; font-size: 13px; font-weight: 600">{{tab.field}}
<input type="text" placeholder="{{tab.ph}}" style="min-height: 44px; box-sizing: border-box; padding: 0 12px; border-radius: 10px; border: 1px solid #CFC3B4; background: #FBF7F2; font: inherit; font-size: 14px; font-weight: 400">
</label>
<button type="button" style="min-height: 44px; padding: 0 20px; border-radius: 10px; border: none; background: #A94E2E; color: #FFFFFF; font: inherit; font-size: 14px; font-weight: 700; cursor: pointer">导入并检查</button>
</div>
<p style="margin: 0; font-size: 13px; color: #4A4239">订阅和配置文件经主代理下载。</p>
</section>

<section aria-labelledby="lst" style="display: flex; flex-direction: column; gap: 12px">
<h2 id="lst" style="margin: 0; font-size: 16px; font-weight: 700">已添加 · 5</h2>
<sc-for list="{{exits}}" as="e" hint-placeholder-count="5">
<article style="padding: 18px 20px; border-radius: 16px; background: #FFFFFF; border: {{e.border}}; display: flex; flex-wrap: wrap; gap: 16px; align-items: center">
<div style="flex: 2 1 260px; min-width: 0; display: flex; flex-direction: column; gap: 8px">
<div style="display: flex; flex-wrap: wrap; align-items: center; gap: 8px">
<span style="font-size: 17px; font-weight: 800; font-family: Inter, monospace">{{e.id}}</span>
<span style="padding: 2px 8px; border-radius: 6px; font-size: 12px; font-weight: 600; background: #EFE7DC; color: #3D362F">{{e.engine}}</span>
</div>
<span style="font-size: 13px; color: #4A4239">{{e.source}}</span>
</div>
<dl style="flex: 3 1 360px; margin: 0; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px">
<div style="display: flex; flex-direction: column; gap: 3px"><dt style="font-size: 12px; color: #5F564C">位置</dt><dd style="margin: 0; font-size: 14px; font-weight: 600">{{e.where}}</dd></div>
<div style="display: flex; flex-direction: column; gap: 3px"><dt style="font-size: 12px; color: #5F564C">出口 IP</dt><dd style="margin: 0; font-size: 14px; font-family: Inter, monospace">{{e.ip}}</dd></div>
<div style="display: flex; flex-direction: column; gap: 3px"><dt style="font-size: 12px; color: #5F564C">延迟</dt><dd style="margin: 0; font-size: 14px">{{e.latency}}</dd></div>
<div style="display: flex; flex-direction: column; gap: 3px"><dt style="font-size: 12px; color: #5F564C">UDP</dt><dd style="margin: 0; font-size: 14px">{{e.udp}}</dd></div>
</dl>
<div style="flex: 1 1 220px; display: flex; flex-direction: column; gap: 8px; align-items: flex-end">
<span style="display: inline-flex; align-items: center; gap: 6px; padding: 4px 10px; border-radius: 999px; font-size: 12px; font-weight: 700; background: {{e.stBg}}; color: {{e.stFg}}">{{e.status}}</span>
<div style="display: flex; flex-wrap: wrap; gap: 6px; justify-content: flex-end">
<button type="button" style="min-height: 36px; padding: 0 12px; border-radius: 8px; border: 1px solid #CFC3B4; background: #FFFFFF; font: inherit; font-size: 13px; cursor: pointer">检查</button>
<button type="button" style="min-height: 36px; padding: 0 12px; border-radius: 8px; border: 1px solid #CFC3B4; background: #FFFFFF; font: inherit; font-size: 13px; cursor: pointer">{{e.nodeAction}}</button>
<button type="button" style="min-height: 36px; padding: 0 12px; border-radius: 8px; border: 1px solid #CFC3B4; background: #FFFFFF; color: #8F1C13; font: inherit; font-size: 13px; cursor: pointer">删除</button>
</div>
<a href="Apps.dc.html" style="font-size: 13px">{{e.users}}</a>
</div>
<sc-if value="{{e.problem}}" hint-placeholder-val="{{ false }}">
<p style="flex: 1 1 100%; margin: 0; padding: 10px 12px; border-radius: 10px; background: #FDF1EF; color: #8F1C13; font-size: 13px">{{e.problem}}</p>
</sc-if>
</article>
</sc-for>
</section>
</main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1280,"height":1000}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { tab: 'sub' };
  }
  renderVals() {
    const defs = {
      sub: { label: 'Clash 订阅', field: '订阅地址', ph: 'https://…', namePh: 'clash-jp', hint: '另一份 Clash / Mihomo 订阅，由单独的 mihomo 进程运行，和主代理互不影响。导入后选一个节点作为这个出口。' },
      file: { label: '配置文件', field: '文件', ph: '选择 .ovpn / .conf / .yaml 文件', namePh: 'ovpn-sg', hint: 'OpenVPN（.ovpn）和 WireGuard（.conf）各自运行在独立的网络命名空间里，可以同时启用多个。' },
      link: { label: '分享链接', field: '链接', ph: 'ss:// vmess:// vless:// trojan:// hy2:// tuic://', namePh: 'ss-hk', hint: '单个节点链接，由 sing-box 运行。可一次粘贴多行，每行生成一个出口。' },
      manual: { label: '手动节点', field: '地址', ph: 'socks5://user:pass@host:1080 或 http://host:8080', namePh: 'home-socks', hint: '自己的 SOCKS5 或 HTTP 代理。账号密码只保存在本机，启动时下发到虚拟机内存。' }
    };
    const order = ['sub', 'file', 'link', 'manual'];
    const tabStyle = 'min-height: 40px; padding: 0 16px; border-radius: 10px; font: inherit; font-size: 14px; cursor: pointer; ';
    const tabs = order.map((id) => ({
      id, label: defs[id].label, on: this.state.tab === id,
      pick: () => this.setState({ tab: id }),
      style: tabStyle + (this.state.tab === id ? 'border: 1.5px solid #2B2B2B; background: #2B2B2B; color: #FFFFFF; font-weight: 700;' : 'border: 1px solid #CFC3B4; background: #FFFFFF; color: #3D362F;')
    }));
    const ok = { status: '检查通过', stBg: '#DCEFE5', stFg: '#1E6B48' };
    const bad = { status: '未通过', stBg: '#FBE3E0', stFg: '#8F1C13' };
    const exits = [
      { id: 'wg-us', engine: 'WireGuard', source: '导入自 us-lax.conf · 独立网络命名空间', where: '美国 洛杉矶', ip: '198.51.100.31', latency: '182 ms', udp: '支持', users: '1 个应用在用：Google Chrome', nodeAction: '编辑', problem: '', ...ok },
      { id: 'clash-jp', engine: 'mihomo', source: 'Clash 订阅「机场 B」 · 当前节点「东京 02」，共 24 个节点', where: '日本 东京', ip: '198.51.100.7', latency: '96 ms', udp: '支持', users: '1 个应用在用：终端里的程序', nodeAction: '换节点', problem: '', ...ok },
      { id: 'ovpn-sg', engine: 'OpenVPN', source: '导入自 sg.ovpn · 独立网络命名空间', where: '新加坡', ip: '198.51.100.66', latency: '74 ms', udp: '支持', users: '没有应用在用', nodeAction: '编辑', problem: '', ...ok },
      { id: 'ss-hk', engine: 'sing-box', source: 'ss:// 链接 · aes-256-gcm', where: '中国香港', ip: '203.0.113.90', latency: '41 ms', udp: '支持', users: '没有应用在用', nodeAction: '编辑', problem: '', ...ok },
      { id: 'vless-de', engine: 'sing-box', source: 'vless:// 链接 · Reality', where: '—', ip: '—', latency: '超时', udp: '—', users: '1 个应用在用：Docker', nodeAction: '编辑', problem: '经此出口访问 HTTPS 超时。指定它的应用（Docker）已被拦截，不会改走主代理；修好出口或在「应用分流」里改去向即可恢复。', ...bad }
    ].map((e) => ({ ...e, border: e.problem ? '1.5px solid #F2C9C3' : '1px solid #E6DCCF' }));
    return { tabs, tab: defs[this.state.tab], exits };
  }
}
</script>
</body>
</html>
