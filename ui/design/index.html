<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Claude 出国 桌面端原型</title>
<!--
  Claude 出国 macOS 桌面应用（SwiftUI）的交互原型。静态页面，无后端，直接用浏览器打开。
  画面模拟 macOS 桌面：顶部菜单栏（含本应用的菜单栏图标）、主窗口、设置窗口、安装引导窗口、
  表单、警告框和系统通知。底部深色条是原型自带的跳转与模拟开关，不属于产品界面。
  所有数据都是示例：IP 使用文档保留地址段，引擎版本为占位。
-->
<style>
:root{
  color-scheme: light;
  --wall: radial-gradient(1200px 700px at 15% 10%, #F2D6B8 0%, transparent 60%), radial-gradient(900px 700px at 90% 90%, #7FA3AC 0%, transparent 60%), linear-gradient(135deg,#E8C2A0,#B9806A 50%,#5F8792);
  --menubar: rgba(248,242,236,.62); --menubar-ink:#1D1D1F;
  --win:#F6F5F3; --win-edge: rgba(0,0,0,.22);
  --side: rgba(236,231,226,.86);
  --box:#FFFFFF; --box-line: rgba(0,0,0,.07);
  --ink:#1D1D1F; --ink2: rgba(0,0,0,.58); --ink3: rgba(0,0,0,.34);
  --sep: rgba(0,0,0,.085);
  --ctl:#FFFFFF; --ctl-line: rgba(0,0,0,.13); --ctl-shadow: 0 .5px 1.5px rgba(0,0,0,.14);
  --hover: rgba(0,0,0,.045); --sel: rgba(0,0,0,.085);
  --accent:#A94E2E; --accent-ink:#fff; --accent-soft: rgba(169,78,46,.11);
  --teal:#2F7486; --teal-soft: rgba(47,116,134,.11);
  --ok:#2E8456; --ok-soft: rgba(46,132,86,.12);
  --warn:#A87708; --warn-soft: rgba(201,154,34,.15);
  --bad:#C4321F; --bad-soft: rgba(196,50,31,.10);
  --gray:#857E77; --gray-soft: rgba(0,0,0,.06);
  --menu: rgba(244,241,238,.88); --menu-line: rgba(0,0,0,.12);
  --sheet:#FBFAF9;
  --win-shadow: 0 0 0 .5px rgba(0,0,0,.28), 0 24px 70px rgba(0,0,0,.32), 0 6px 18px rgba(0,0,0,.12);
  --proto:#141414;
}
:root[data-theme="dark"]{
  color-scheme: dark;
  --wall: radial-gradient(1200px 700px at 15% 10%, #5A3A2A 0%, transparent 60%), radial-gradient(900px 700px at 90% 90%, #20414A 0%, transparent 60%), linear-gradient(135deg,#2B211C,#3A2620 50%,#15262B);
  --menubar: rgba(30,28,27,.55); --menubar-ink:#F2F1F0;
  --win:#1F1E1D; --win-edge: rgba(255,255,255,.14);
  --side: rgba(42,40,38,.86);
  --box:#2A2928; --box-line: rgba(255,255,255,.06);
  --ink:#F3F2F1; --ink2: rgba(255,255,255,.6); --ink3: rgba(255,255,255,.32);
  --sep: rgba(255,255,255,.08);
  --ctl:#3B3a38; --ctl-line: rgba(255,255,255,.09); --ctl-shadow: 0 .5px 1px rgba(0,0,0,.4);
  --hover: rgba(255,255,255,.06); --sel: rgba(255,255,255,.1);
  --accent:#D57954; --accent-ink:#1B1110; --accent-soft: rgba(213,121,84,.18);
  --teal:#74B9C9; --teal-soft: rgba(116,185,201,.15);
  --ok:#62C38F; --ok-soft: rgba(98,195,143,.15);
  --warn:#E4B94F; --warn-soft: rgba(228,185,79,.16);
  --bad:#F27563; --bad-soft: rgba(242,117,99,.15);
  --gray:#A39C95; --gray-soft: rgba(255,255,255,.07);
  --menu: rgba(44,43,41,.9); --menu-line: rgba(255,255,255,.12);
  --sheet:#2C2B2A;
  --win-shadow: 0 0 0 .5px rgba(0,0,0,.6), 0 24px 70px rgba(0,0,0,.6), 0 0 0 1px rgba(255,255,255,.06) inset;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--proto);color:var(--ink);font:13px/1.4 -apple-system,BlinkMacSystemFont,"SF Pro Text","PingFang SC","Hiragino Sans GB","Helvetica Neue",sans-serif;-webkit-font-smoothing:antialiased;overflow:hidden}
button,input,select{font:inherit;color:inherit}
button{cursor:default}
h1,h2,h3,p,ul,ol,dl,dd{margin:0}
ul,ol{padding:0;list-style:none}
code,.mono{font-family:"SF Mono",ui-monospace,Menlo,monospace;font-size:12px}
svg.i{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round;flex:0 0 auto}

/* 舞台：固定 1280×820 的 macOS 桌面，按视口等比缩放 */
#viewport{position:fixed;inset:0 0 44px 0;display:flex;align-items:center;justify-content:center;overflow:hidden}
#stage{position:relative;width:1280px;height:820px;background:var(--wall);overflow:hidden;transform-origin:center center;border-radius:6px}

/* 系统菜单栏 */
.mbar{position:absolute;inset:0 0 auto 0;height:26px;display:flex;align-items:center;gap:18px;padding:0 14px;background:var(--menubar);backdrop-filter:blur(24px) saturate(1.6);-webkit-backdrop-filter:blur(24px) saturate(1.6);color:var(--menubar-ink);font-size:13px;z-index:50}
.mbar b{font-weight:700}
.mbar .sp{flex:1}
.mbar .si{display:flex;align-items:center;height:22px;padding:0 6px;border-radius:5px;gap:4px;position:relative}
.mbar .si.on{background:rgba(0,0,0,.14)}
:root[data-theme="dark"] .mbar .si.on{background:rgba(255,255,255,.18)}
.mbar .si .sdot{position:absolute;right:3px;bottom:3px;width:6px;height:6px;border-radius:3px;box-shadow:0 0 0 1.2px var(--menubar)}

/* 窗口 */
.win{position:absolute;border-radius:12px;overflow:hidden;background:var(--win);box-shadow:var(--win-shadow);display:flex}
.traffic{position:absolute;top:18px;left:18px;display:flex;gap:8px;z-index:3}
.traffic i{width:12px;height:12px;border-radius:6px;display:block;box-shadow:inset 0 0 0 .5px rgba(0,0,0,.18)}
.traffic i:nth-child(1){background:#FF5F57}.traffic i:nth-child(2){background:#FEBC2E}.traffic i:nth-child(3){background:#28C840}
.win.inactive .traffic i{background:#CFCBC7}
:root[data-theme="dark"] .win.inactive .traffic i{background:#4A4846}
.side{width:224px;flex:0 0 224px;background:var(--side);backdrop-filter:blur(30px) saturate(1.5);-webkit-backdrop-filter:blur(30px) saturate(1.5);border-right:1px solid var(--sep);padding:52px 10px 12px;display:flex;flex-direction:column;gap:2px}
.nav-h{font-size:11px;font-weight:600;color:var(--ink3);padding:10px 8px 3px}
.nav a{display:flex;align-items:center;gap:8px;height:28px;padding:0 8px;border-radius:6px;color:var(--ink);text-decoration:none}
.nav a svg{color:var(--accent)}
.nav a.on{background:var(--sel)}
.nav a .cnt{margin-left:auto;font-size:11px;color:var(--ink2);font-weight:600}
.nav a .cnt.bad{color:#fff;background:var(--bad);border-radius:8px;padding:0 6px;line-height:16px}
.side-status{margin-top:auto;display:flex;flex-direction:column;gap:6px;padding:10px 8px 2px;border-top:1px solid var(--sep);font-size:11px;color:var(--ink2)}
.side-status div{display:flex;align-items:center;gap:7px}
.dot{width:7px;height:7px;border-radius:4px;display:inline-block;flex:0 0 auto}
.mainc{flex:1;min-width:0;display:flex;flex-direction:column}
.toolbar{height:52px;flex:0 0 52px;display:flex;align-items:center;gap:8px;padding:0 14px 0 20px;border-bottom:1px solid var(--sep)}
.toolbar h1{font-size:15px;font-weight:700}
.toolbar .sub{font-size:12px;color:var(--ink2)}
.toolbar .sp{flex:1}
.scroll{flex:1;overflow:auto;padding:18px 24px 28px;display:flex;flex-direction:column;gap:18px}
.scroll::-webkit-scrollbar{width:10px}.scroll::-webkit-scrollbar-thumb{background:var(--sep);border-radius:5px;border:2px solid var(--win)}

/* 控件 */
.b{display:inline-flex;align-items:center;justify-content:center;gap:5px;height:22px;padding:0 10px;border-radius:5px;border:.5px solid var(--ctl-line);background:var(--ctl);box-shadow:var(--ctl-shadow);font-size:13px;white-space:nowrap}
.b.lg{height:28px;padding:0 14px;border-radius:7px}
.b.xl{height:32px;padding:0 18px;border-radius:8px;font-size:14px;font-weight:600}
.b.pri{background:var(--accent);color:var(--accent-ink);border-color:transparent;font-weight:600}
.b.dest{color:var(--bad)}
.b.dest-fill{background:var(--bad);color:#fff;border-color:transparent;font-weight:600}
.b.ghost{background:transparent;border-color:transparent;box-shadow:none;color:var(--ink2)}
.b.ghost:hover{background:var(--hover)}
.b.icon{width:28px;padding:0}
.b:disabled{opacity:.42}
.link{background:none;border:none;padding:0;color:var(--accent);font-size:13px}
.pop{position:relative;display:inline-flex;align-items:center}
.pop select{appearance:none;-webkit-appearance:none;height:22px;padding:0 24px 0 8px;border-radius:5px;border:.5px solid var(--ctl-line);background:var(--ctl);box-shadow:var(--ctl-shadow);font-size:13px;min-width:120px}
.pop svg{position:absolute;right:5px;width:12px;height:12px;pointer-events:none;color:var(--ink2)}
.pop.lg select{height:28px;border-radius:7px}
.tf{height:22px;padding:0 7px;border-radius:5px;border:.5px solid var(--ctl-line);background:var(--ctl);box-shadow:inset 0 .5px 1px rgba(0,0,0,.06);font-size:13px;min-width:0}
.tf.lg{height:28px;border-radius:7px;padding:0 9px}
.tf::placeholder{color:var(--ink3)}
.segc{display:inline-flex;padding:2px;border-radius:7px;background:var(--gray-soft);gap:2px}
.segc button{height:20px;padding:0 12px;border-radius:5px;border:none;background:transparent;font-size:12px}
.segc button.on{background:var(--ctl);box-shadow:0 .5px 2px rgba(0,0,0,.18);font-weight:600}
.segc.lg button{height:24px;font-size:13px}
.sw{appearance:none;-webkit-appearance:none;width:32px;height:18px;border-radius:9px;background:var(--gray-soft);box-shadow:inset 0 0 0 .5px var(--ctl-line);position:relative;margin:0;flex:0 0 auto;transition:background .15s}
.sw::after{content:"";position:absolute;top:1.5px;left:1.5px;width:15px;height:15px;border-radius:8px;background:#fff;box-shadow:0 .5px 2px rgba(0,0,0,.3);transition:left .15s}
.sw:checked{background:var(--accent)}
.sw:checked::after{left:15.5px}
.sw:disabled{opacity:.45}
.cb,.rd{appearance:none;-webkit-appearance:none;width:14px;height:14px;margin:0;border-radius:4px;background:var(--ctl);border:.5px solid var(--ctl-line);box-shadow:var(--ctl-shadow);position:relative;flex:0 0 auto}
.rd{border-radius:7px}
.cb:checked,.rd:checked{background:var(--accent);border-color:transparent}
.cb:checked::after{content:"";position:absolute;left:4.5px;top:1.5px;width:3.5px;height:7px;border:solid #fff;border-width:0 1.8px 1.8px 0;transform:rotate(45deg)}
.rd:checked::after{content:"";position:absolute;left:4px;top:4px;width:6px;height:6px;border-radius:3px;background:#fff}
.cb:disabled{opacity:.5}
label.inl{display:inline-flex;align-items:center;gap:7px}

/* 徽标与标记 */
.badge{display:inline-flex;align-items:center;gap:4px;height:18px;padding:0 7px;border-radius:5px;font-size:11px;font-weight:600;white-space:nowrap}
.badge.ok{background:var(--ok-soft);color:var(--ok)}
.badge.warn{background:var(--warn-soft);color:var(--warn)}
.badge.bad{background:var(--bad-soft);color:var(--bad)}
.badge.teal{background:var(--teal-soft);color:var(--teal)}
.badge.gray{background:var(--gray-soft);color:var(--ink2)}
.badge.acc{background:var(--accent-soft);color:var(--accent)}
.mk{width:18px;height:18px;border-radius:9px;display:inline-flex;align-items:center;justify-content:center;flex:0 0 auto}
.mk svg{width:12px;height:12px;stroke-width:2.2}
.mk.ok{background:var(--ok);color:#fff}.mk.warn{background:var(--warn);color:#fff}.mk.bad{background:var(--bad);color:#fff}.mk.wait{background:var(--gray-soft);color:var(--ink2)}.mk.off{background:var(--gray-soft);color:var(--ink3)}.mk.skip{background:var(--gray-soft);color:var(--ink2)}
.spin{width:12px;height:12px;border-radius:6px;border:2px solid var(--ink3);border-top-color:transparent;animation:sp .8s linear infinite;display:inline-block}
@keyframes sp{to{transform:rotate(360deg)}}

/* 表单分组（SwiftUI Form .grouped） */
.grp{display:flex;flex-direction:column;gap:6px}
.grp-h{display:flex;align-items:flex-end;gap:8px;padding:0 4px;font-size:13px;font-weight:600}
.grp-h .sp{flex:1}
.grp-h .x{font-weight:400;color:var(--ink2);font-size:12px}
.box{background:var(--box);border-radius:10px;box-shadow:0 0 0 .5px var(--box-line),0 .5px 1px rgba(0,0,0,.04)}
.r{position:relative;display:flex;align-items:center;gap:12px;min-height:38px;padding:7px 12px}
.r+.r::before{content:"";position:absolute;top:0;left:12px;right:0;height:1px;background:var(--sep)}
.r .l{flex:1;min-width:0;display:flex;flex-direction:column;gap:1px}
.r .l small{font-size:11px;color:var(--ink2);line-height:1.35}
.r .v{color:var(--ink2);text-align:right}
.r .acts{display:flex;gap:6px;align-items:center}
.grp-f{padding:0 4px;font-size:11px;color:var(--ink2);line-height:1.5}
.cols{display:grid;grid-template-columns:1fr 1fr;gap:18px;align-items:start}

/* 列表表格 */
.tbl .th{display:grid;padding:6px 12px;font-size:11px;color:var(--ink2);font-weight:600;border-bottom:1px solid var(--sep)}
.tbl .tr{display:grid;align-items:center;padding:7px 12px;position:relative}
.tbl .tr+.tr{border-top:1px solid var(--sep)}
.tbl .tr.sel{background:var(--accent-soft)}
.appi{width:24px;height:24px;border-radius:6px;display:inline-flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;color:#fff;flex:0 0 auto;box-shadow:inset 0 0 0 .5px rgba(0,0,0,.12)}
.nm{display:flex;align-items:center;gap:9px;min-width:0}
.nm .t{display:flex;flex-direction:column;min-width:0}
.nm .t small{font-size:11px;color:var(--ink2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.inote{font-size:11px;line-height:1.45;padding:3px 7px;border-radius:5px;margin-top:3px;display:inline-block}
.inote.warn{background:var(--warn-soft);color:var(--warn)}
.inote.bad{background:var(--bad-soft);color:var(--bad)}
.inote.teal{background:var(--teal-soft);color:var(--teal)}

/* 首页状态 */
.hero{display:flex;gap:16px;padding:16px 18px;border-radius:12px;align-items:flex-start}
.hero .ico{width:44px;height:44px;border-radius:22px;display:flex;align-items:center;justify-content:center;flex:0 0 auto}
.hero .ico svg{width:24px;height:24px;stroke-width:1.8}
.hero .txt{flex:1;min-width:0;display:flex;flex-direction:column;gap:5px}
.hero h2{font-size:20px;font-weight:700;letter-spacing:.1px}
.hero p{color:var(--ink2);line-height:1.5;max-width:560px}
.hero .kv{display:flex;flex-wrap:wrap;gap:6px 22px;margin-top:6px}
.hero .kv div{display:flex;flex-direction:column}
.hero .kv span{font-size:11px;color:var(--ink2)}
.hero .kv b{font-weight:600}
.hero .btns{display:flex;flex-direction:column;gap:8px;flex:0 0 150px}
.hero .btns .b{width:100%}
.bar{display:flex;height:8px;border-radius:4px;overflow:hidden;background:var(--gray-soft)}
.pending{display:flex;align-items:center;gap:10px;padding:9px 12px;border-radius:10px;background:var(--warn-soft);color:var(--ink)}
.pending svg{color:var(--warn)}

/* 链路 */
.hops{display:flex;align-items:stretch;gap:6px;padding:12px;overflow-x:auto}
.hop{min-width:118px;padding:8px 10px;border-radius:8px;background:var(--gray-soft);display:flex;flex-direction:column;gap:1px}
.hop small{font-size:10px;color:var(--ink2);font-weight:600}
.hop b{font-size:12px;font-weight:600}
.hop span{font-size:11px;color:var(--ink2)}
.hop.mid{background:var(--teal-soft)}
.hop.fin{background:var(--teal);color:#fff}.hop.fin small,.hop.fin span{color:rgba(255,255,255,.82)}
.harr{align-self:center;color:var(--ink3)}

/* 菜单、通知、弹窗 */
.menu{position:absolute;top:28px;width:290px;padding:5px;border-radius:10px;background:var(--menu);backdrop-filter:blur(30px) saturate(1.6);-webkit-backdrop-filter:blur(30px) saturate(1.6);box-shadow:0 0 0 .5px var(--menu-line),0 12px 36px rgba(0,0,0,.28);z-index:60;font-size:13px}
.menu .hd{padding:6px 10px 8px;display:flex;flex-direction:column;gap:3px}
.menu .hd b{font-size:13px}
.menu .hd .m{font-size:11px;color:var(--ink2);display:flex;justify-content:space-between}
.menu .mi{display:flex;align-items:center;height:22px;padding:0 10px;border-radius:5px;gap:6px}
.menu .mi:hover:not(.dis){background:var(--accent);color:var(--accent-ink)}
.menu .mi .k{margin-left:auto;color:var(--ink3);font-size:12px}
.menu .mi:hover .k{color:inherit}
.menu .mi.dis{color:var(--ink3)}
.menu hr{border:none;height:1px;background:var(--sep);margin:5px 10px}
.notif{position:absolute;top:34px;right:12px;width:350px;padding:11px 12px;border-radius:16px;background:var(--menu);backdrop-filter:blur(30px) saturate(1.6);-webkit-backdrop-filter:blur(30px) saturate(1.6);box-shadow:0 0 0 .5px var(--menu-line),0 10px 30px rgba(0,0,0,.25);display:flex;gap:10px;z-index:70;animation:nin .25s ease-out}
@keyframes nin{from{transform:translateX(30px);opacity:0}}
.notif .t{display:flex;flex-direction:column;gap:2px;min-width:0}
.notif .t b{font-size:13px}
.notif .t span{font-size:12px;color:var(--ink2);line-height:1.4}
.notif .tm{position:absolute;right:12px;top:10px;font-size:11px;color:var(--ink3)}
.dim{position:absolute;inset:0;background:rgba(0,0,0,.14);display:flex;justify-content:center;align-items:flex-start;padding-top:46px;z-index:20}
.sheet{width:540px;max-height:calc(100% - 70px);overflow:auto;background:var(--sheet);border-radius:12px;box-shadow:0 0 0 .5px var(--win-edge),0 18px 50px rgba(0,0,0,.35);padding:18px 20px 16px;display:flex;flex-direction:column;gap:12px;animation:sin .22s ease-out}
@keyframes sin{from{transform:translateY(-14px);opacity:0}}
.sheet h2{font-size:15px;font-weight:700}
.sheet .lead{color:var(--ink2);line-height:1.5}
.sheet .foot{display:flex;justify-content:flex-end;gap:8px;padding-top:4px}
.sheet .foot .sp{flex:1}
.alert{width:272px;background:var(--sheet);border-radius:12px;box-shadow:0 0 0 .5px var(--win-edge),0 18px 50px rgba(0,0,0,.4);padding:20px 16px 16px;display:flex;flex-direction:column;align-items:center;gap:10px;text-align:center;animation:sin .22s ease-out;margin-top:70px}
.alert h2{font-size:13px;font-weight:700}
.alert p{font-size:11px;color:var(--ink2);line-height:1.5}
.alert .bs{display:flex;flex-direction:column;gap:8px;width:100%;margin-top:4px}
.alert .bs .b{width:100%;height:28px;border-radius:7px}
.aicon{position:relative;width:64px;height:64px}
.aicon .w{position:absolute;right:-4px;bottom:-2px;width:28px;height:28px;border-radius:7px;background:#F5C33B;color:#4A3500;display:flex;align-items:center;justify-content:center;box-shadow:0 1px 3px rgba(0,0,0,.3)}
.aicon .w svg{width:18px;height:18px;stroke-width:2}
.steps-run{display:flex;flex-direction:column;gap:8px;padding:12px}
.steps-run li{display:flex;align-items:center;gap:9px}
.steps-run li.todo{color:var(--ink3)}

/* 安装引导 */
.setup{display:flex;width:100%}
.setup .left{width:230px;flex:0 0 230px;background:var(--side);border-right:1px solid var(--sep);padding:54px 18px 18px;display:flex;flex-direction:column;gap:14px}
.setup .left h2{font-size:15px;font-weight:700}
.setup .left p{font-size:12px;color:var(--ink2);line-height:1.5}
.sstep{display:flex;align-items:center;gap:9px;padding:6px 6px;border-radius:7px;color:var(--ink2)}
.sstep i{width:20px;height:20px;border-radius:10px;border:1.5px solid var(--ink3);display:flex;align-items:center;justify-content:center;font-style:normal;font-size:11px;font-weight:700}
.sstep.cur{color:var(--ink);font-weight:600;background:var(--sel)}
.sstep.cur i{border-color:var(--accent);color:var(--accent)}
.sstep.done i{background:var(--ok);border-color:var(--ok);color:#fff}
.setup .right{flex:1;min-width:0;display:flex;flex-direction:column}
.setup .body{flex:1;overflow:auto;padding:40px 32px 16px;display:flex;flex-direction:column;gap:16px}
.setup .body h1{font-size:22px;font-weight:700}
.setup .body .lead{color:var(--ink2);line-height:1.55;max-width:520px}
.setup .foot{display:flex;align-items:center;gap:8px;padding:12px 18px;border-top:1px solid var(--sep)}
.setup .foot .sp{flex:1}

/* 设置窗口 */
.prefs-tb{position:absolute;top:0;left:0;right:0;height:78px;display:flex;flex-direction:column;align-items:center;border-bottom:1px solid var(--sep);padding-top:8px;background:var(--win);z-index:2}
.prefs-tb .ttl{font-size:13px;font-weight:700;margin-bottom:6px}
.prefs-tabs{display:flex;gap:2px}
.prefs-tabs button{display:flex;flex-direction:column;align-items:center;gap:2px;width:100px;white-space:nowrap;height:44px;border:none;border-radius:7px;background:transparent;font-size:11px;color:var(--ink2);padding-top:5px}
.prefs-tabs button svg{width:20px;height:20px;color:var(--ink2)}
.prefs-tabs button.on{background:var(--sel);color:var(--ink)}
.prefs-tabs button.on svg{color:var(--accent)}

/* 原型条 */
#proto{position:fixed;left:0;right:0;bottom:0;height:44px;display:flex;align-items:center;gap:4px;padding:0 10px;background:#0E0E0E;color:#DDD;font-size:12px;overflow-x:auto;white-space:nowrap;border-top:1px solid #2A2A2A}
#proto a,#proto button{color:#CFCFCF;text-decoration:none;padding:5px 9px;border-radius:6px;border:none;background:transparent;font-size:12px;cursor:pointer}
#proto a.on{background:#F2F2F2;color:#111}
#proto button:hover,#proto a:hover:not(.on){background:#2A2A2A}
#proto .sep{width:1px;height:20px;background:#333;margin:0 6px;flex:0 0 auto}
#proto .lbl{color:#888;padding:0 4px}
#proto button.on{background:#3A2A22;color:#F2B79E}

const MAIN_PAGES = { main: pageMain, proxy: pageProxy, exits: pageExits, apps: pageApps, env: pageEnv, region: pageRegion, engines: pageEngines };
const ROUTES = ['main', 'proxy', 'exits', 'apps', 'env', 'region', 'engines', 'setup', 'settings', 'states'];
const RNAMES = { main: '总览', proxy: '主代理', exits: '分流出口', apps: '应用分流', env: '环境检测', region: '地区', engines: '引擎', setup: '安装引导', settings: '设置窗口', states: '状态对照' };

function route() { const h = location.hash.slice(1); return ROUTES.includes(h) ? h : 'main'; }
function render() {
  const p = route();
  const sc = document.getElementById('scroll');
  const keep = sc && sc.dataset.page === p ? sc.scrollTop : 0;
  let html = menubar();
  if (S.uninstalled) {
    html += `<div style="position:absolute;inset:26px 0 0 0;display:flex;align-items:center;justify-content:center;color:rgba(255,255,255,.9);font-size:15px;text-shadow:0 1px 4px rgba(0,0,0,.4)">Claude 出国已卸载。点下方「重置原型」重新开始。</div>`;
  } else if (p === 'setup') html += setupWindow();
  else if (p === 'states') html += statesBoard();
  else if (p === 'settings') { S.page = 'main'; html += pageMain().replace('class="win"', 'class="win inactive"').replace('<div class="dim">', '<div class="dim" style="display:none">') + prefsWindow(); }
  else html += MAIN_PAGES[p]();
  if (S.menu) html += menuDrop();
  html += notif();
  document.getElementById('stage').innerHTML = html;
  const ns = document.getElementById('scroll'); if (ns) { ns.dataset.page = p; ns.scrollTop = keep; }
  renderProto(p);
  document.documentElement.dataset.theme = S.theme || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
}
function renderProto(p) {
  const links = ROUTES.map(id => `<a href="#${id}" class="${id === p ? 'on' : ''}">${RNAMES[id]}</a>`).join('');
  document.getElementById('proto').innerHTML = `<span class="lbl">原型</span>${links}<span class="sep"></span>
<span class="lbl">状态</span>${['abroad', 'checking', 'envfail', 'offline', 'home'].map(k => `<button class="${S.mode === k ? 'on' : ''}" data-proto="mode" data-v="${k}">${MODES[k].pill}</button>`).join('')}<span class="sep"></span>
<span class="lbl">模拟</span><button data-proto="launchClaude">点 Claude 图标</button><button data-proto="reboot">重启提示</button><button class="${S.stuck ? 'on' : ''}" data-proto="stuck">回国时进程结束不了</button><span class="sep"></span>
<button data-proto="theme">${S.theme === 'dark' ? '深色' : S.theme === 'light' ? '浅色' : '外观跟随系统'}</button><button data-proto="reset">重置原型</button>`;
}
function fit() {
  const vp = document.getElementById('viewport');
  const s = Math.min(vp.clientWidth / 1280, vp.clientHeight / 820, 1);
  document.getElementById('stage').style.transform = `scale(${s})`;
}
function set(fn) { fn(); render(); }
function notify(title, body, ms = 4500) { S.notif = [title, body]; render(); later(() => set(() => { S.notif = null; }), ms); }
function countdown(next) { S.countdown = 3; const tick = () => { if (S.sheet !== next) return; if (S.countdown > 0) { S.countdown--; render(); later(tick, 1000); } }; later(tick, 1000); }
function runSteps(sheet, n, onDone, failAt = -1) {
  S.sheet = sheet; S.runStep = 0; render();
  const step = () => {
    if (S.sheet !== sheet) return;
    if (S.runStep === failAt) { set(() => { S.sheet = 'restoreFail'; }); return; }
    if (S.runStep >= n) { onDone(); return; }
    S.runStep++; render(); later(step, 520);
  };
  later(step, 520);
}
function startEnable() {
  clearAll();
  set(() => { S.mode = 'checking'; S.menu = false; });
  later(() => {
    notify('已强制结束 Claude', '语言改为 English (US)、时区改为洛杉矶。Claude 已结束，检测通过后点「打开 Claude」即可使用新语言。');
    later(() => set(() => { S.mode = 'abroad'; S.sheet = 'reboot'; }), 1600);
  }, 1500);
}

document.addEventListener('click', (e) => {
  const pr = e.target.closest('[data-proto]');
  if (pr) {
    const v = pr.dataset.v;
    switch (pr.dataset.proto) {
      case 'mode': clearAll(); set(() => { S.mode = v; S.sheet = null; S.uninstalled = false; }); break;
      case 'stuck': set(() => { S.stuck = !S.stuck; }); break;
      case 'theme': set(() => { S.theme = S.theme === '' ? 'light' : S.theme === 'light' ? 'dark' : ''; }); break;
      case 'reboot': set(() => { S.sheet = 'reboot'; if (!MAIN_PAGES[route()]) location.hash = 'main'; }); break;
      case 'launchClaude':
        if (S.mode === 'home') notify('不允许启动 Claude', '现在是本机网络（已回国）。要使用 Claude，请先启用 Claude 出国；如果不再使用，可以在设置里一键卸载。', 6000);
        else if (S.mode === 'checking' || S.mode === 'envfail') notify('暂不允许启动 Claude', S.mode === 'checking' ? '环境检测还没完成，通过后就可以启动。' : '环境检测第 08 项未通过，修好并重新检测后才能启动。', 6000);
        else notify('Claude 已启动', S.mode === 'offline' ? '当前已断网，Claude 没有网络。' : '是你自己打开的，允许启动。Claude 出国不会自动打开它。');
        break;
      case 'reset': clearAll(); Object.assign(S, { mode: 'abroad', sheet: null, menu: false, notif: null, rebootPending: false, uninstalled: false, stuck: false, setup: { step: 0, allowed: false, allowing: false, stage: 'import', tab: 'sub', mode: 'single', node: 'la01', checking: false, done: false } }); location.hash = 'main'; render(); break;
    }
    return;
  }
  const go = e.target.closest('[data-go]');
  if (go) { S.menu = false; location.hash = go.dataset.go; return; }
  const el = e.target.closest('[data-act]');
  if (!el) { if (S.menu && !e.target.closest('.menu')) set(() => { S.menu = false; }); return; }
  if (el.tagName === 'SELECT' || (el.tagName === 'INPUT' && el.type !== 'radio' && !el.closest('.tr'))) return;
  const v = el.dataset.v;
  switch (el.dataset.act) {
    case 'menu': set(() => { S.menu = !S.menu; }); break;
    case 'enable': startEnable(); break;
    case 'disable': clearAll(); set(() => { S.mode = 'offline'; S.menu = false; }); notify('已断网', '服务已停用，除"断网时允许"的应用外全部断网。'); break;
    case 'restore': set(() => { S.menu = false; S.sheet = 'restore1'; if (!MAIN_PAGES[route()]) location.hash = 'main'; }); break;
    case 'restore2': set(() => { S.sheet = 'restore2'; }); countdown('restore2'); break;
    case 'restoreRun': runSteps('restoreRun', 7, () => { set(() => { S.sheet = 'reboot'; S.mode = 'home'; }); notify('已回国', '本机网络已恢复。回国状态下不允许启动 Claude。'); }, S.stuck ? 1 : -1); break;
    case 'killBrowsers': S.killBrowsers = el.checked; break;
    case 'closeSheet': set(() => { S.sheet = null; }); break;
    case 'rebootNow': set(() => { S.sheet = null; S.rebootPending = false; S.menu = false; }); notify('正在重启…', '（原型）重启后语言生效，开机先加载断网保护。'); break;
    case 'rebootLater': set(() => { S.sheet = null; S.rebootPending = true; }); break;
    case 'showReboot': set(() => { S.sheet = 'reboot'; }); break;
    case 'envRun': if (S.mode === 'home' || S.mode === 'offline') break; S.menu = false; set(() => { S.envRunning = true; }); later(() => set(() => { S.envRunning = false; if (S.mode === 'envfail') S.mode = 'abroad'; }), 1600); break;
    case 'prefs': S.menu = false; S.prefsTab = v || 'general'; location.hash = 'settings'; render(); break;
    case 'prefsTab': set(() => { S.prefsTab = v; }); break;
    case 'uninstall': set(() => { S.sheet = 'uninstall1'; }); break;
    case 'uninstall2': set(() => { S.sheet = 'uninstall2'; }); countdown('uninstall2'); break;
    case 'uninstallRun': runSteps('uninstallRun', 6, () => set(() => { S.sheet = 'uninstallDone'; S.mode = 'home'; })); break;
    case 'uninstallTrash': set(() => { S.sheet = null; S.uninstalled = true; }); break;
    case 'openClaude': S.menu = false; notify('Claude 已打开', '打开前补跑了环境检测：硬性 12/12 通过。'); break;
    case 'quitInfo': S.menu = false; notify('后台服务继续运行', '退出应用不会停止接管，也不会解除 Claude 启动管控。'); break;
    case 'sheet': set(() => { S.addTab = 'sub'; S.sheet = v; }); break;
    case 'addTab': set(() => { S.addTab = v; }); break;
    case 'proxyMode': set(() => { S.proxyMode = v; }); break;
    case 'proxyNode': set(() => { S.proxyNode = v; }); break;
    case 'appFilter': set(() => { S.appFilter = v; }); break;
    case 'region': set(() => { S.region = v; }); break;
    case 'setupAllow': set(() => { S.setup.allowing = true; }); later(() => set(() => { S.setup.allowing = false; S.setup.allowed = true; }), 1400); break;
    case 'setupNext': set(() => { S.setup.step = 1; }); break;
    case 'setupTab': set(() => { S.setup.tab = v; }); break;
    case 'setupImport': set(() => { S.setup.stage = 'nodes'; }); break;
    case 'setupBack': set(() => { S.setup.stage = 'import'; }); break;
    case 'setupMode': set(() => { S.setup.mode = v; }); break;
    case 'setupNode': set(() => { S.setup.node = v; }); break;
    case 'setupApply': set(() => { S.setup.step = 2; S.setup.done = false; }); later(() => set(() => { S.setup.done = true; }), 1500); break;
    case 'setupFinish': S.setup.step = 3; location.hash = 'main'; startEnable(); break;
  }
});
document.addEventListener('change', (e) => {
  const el = e.target.closest('[data-act]');
  if (!el) return;
  if (el.dataset.act === 'route') set(() => { S.routes[el.dataset.v] = el.value; });
  if (el.dataset.act === 'offline') set(() => { S.offline[el.dataset.v] = el.checked; });
  if (el.dataset.act === 'killBrowsers') S.killBrowsers = el.checked;
  if (el.dataset.act === 'envToggle') set(() => { S.envOff[el.dataset.v] = !el.checked; });
});
window.addEventListener('hashchange', () => { S.menu = false; if (!['settings'].includes(route()) && S.sheet && S.sheet.startsWith('uninstall') && route() !== 'settings') S.sheet = null; render(); });
window.addEventListener('resize', fit);
matchMedia('(prefers-color-scheme: dark)').addEventListener('change', render);
render(); fit();
</script>
</body>
</html>
