  <g transform="translate(92 176) rotate(-12)">
    <rect x="-34" y="-46" width="68" height="90" rx="7" fill="#1F3A5F"/>
    <rect x="-34" y="-46" width="8" height="90" rx="3" fill="#17304F"/>
    <circle cx="2" cy="-12" r="16" fill="none" stroke="#E8C468" stroke-width="3"/>
    <ellipse cx="2" cy="-12" rx="7" ry="16" fill="none" stroke="#E8C468" stroke-width="2.5"/>
    <path d="M-14 -12 L18 -12" stroke="#E8C468" stroke-width="2.5"/>
    <text x="2" y="24" font-family="Helvetica, Arial, sans-serif" font-size="9.5" font-weight="700" letter-spacing="1" fill="#E8C468" text-anchor="middle">PASSPORT</text>
  </g>
  <circle cx="94" cy="220" r="14" fill="#D97757"/>
</svg>
  <g font-family="PingFang SC, Noto Sans SC, Microsoft YaHei, sans-serif">
    <text x="500" y="178" font-size="92" font-weight="800" fill="#2B2B2B">Claude 出国</text>
    <text x="504" y="246" font-size="40" font-weight="600" fill="#D97757">整机出关，一键回国</text>
    <text x="504" y="312" font-size="22" fill="#6B6158">Clash · SS · OpenVPN · WireGuard 全装进一台口袋虚拟机</text>
    <text x="504" y="350" font-size="22" fill="#6B6158">时区语言随出口切换 · 指定应用回本机网络 · 服务一停整机断网</text>
  </g>
</svg>
