    <path d="M98 122 L110 122 M104 116 L104 128" stroke="#3E7C8C" stroke-width="3" stroke-linecap="round"/>
    <circle cx="26" cy="196" r="11" fill="#2B2B2B"/>
    <circle cx="100" cy="196" r="11" fill="#2B2B2B"/>
  </g>

