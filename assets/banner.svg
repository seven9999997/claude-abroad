<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 440" width="1200" height="440">
  <title>Claude 出国</title>
  <rect width="1200" height="440" rx="28" fill="#FBF7F2"/>
  <svg x="40" y="10" width="420" height="420" viewBox="0 0 512 512">
