  <ellipse cx="172" cy="418" rx="24" ry="13" fill="#B85F42"/>
  <ellipse cx="236" cy="418" rx="24" ry="13" fill="#B85F42"/>

  <!-- 身体 -->
  <ellipse cx="204" cy="320" rx="92" ry="100" fill="#D97757"/>
  <ellipse cx="176" cy="262" rx="30" ry="16" fill="#E58B6D" opacity="0.45"/>

  <!-- 帽子 -->
  <path d="M146 232 Q 150 182 204 180 Q 258 182 262 232 Z" fill="#F2C14E"/>
  <rect x="148" y="212" width="112" height="12" fill="#3E7C8C"/>
  <ellipse cx="204" cy="234" rx="78" ry="13" fill="#E8B33E"/>

  <!-- 脸 -->
  <ellipse cx="178" cy="302" rx="9" ry="12" fill="#2B2B2B"/>
  <ellipse cx="232" cy="302" rx="9" ry="12" fill="#2B2B2B"/>
  <circle cx="181" cy="297" r="3" fill="#FFFFFF"/>
  <circle cx="235" cy="297" r="3" fill="#FFFFFF"/>
  <ellipse cx="156" cy="328" rx="13" ry="7" fill="#F2A08A"/>
  <ellipse cx="254" cy="328" rx="13" ry="7" fill="#F2A08A"/>
  <path d="M190 330 Q 205 346 220 330" fill="none" stroke="#2B2B2B" stroke-width="4.5" stroke-linecap="round"/>

