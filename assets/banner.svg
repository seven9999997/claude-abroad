  <g transform="translate(450 140) rotate(28)">
    <path d="M-26 0 L22 0 Q30 0 30 4 Q30 8 22 8 L-26 8 Z" fill="#3E7C8C"/>
    <path d="M-2 4 L-16 -22 L-8 -22 L12 4 Z" fill="#3E7C8C"/>
    <path d="M-2 6 L-16 30 L-8 30 L12 6 Z" fill="#3E7C8C"/>
    <path d="M-24 4 L-30 -10 L-24 -10 L-16 4 Z" fill="#3E7C8C"/>
  </g>
