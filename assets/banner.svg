    <rect x="0" y="40" width="126" height="150" rx="20" fill="#3E7C8C"/>
    <rect x="0" y="40" width="126" height="150" rx="20" fill="none" stroke="#2F6170" stroke-width="4"/>
    <rect x="30" y="40" width="10" height="150" fill="#2F6170" opacity="0.55"/>
    <rect x="86" y="40" width="10" height="150" fill="#2F6170" opacity="0.55"/>
    <!-- 贴纸 -->
    <circle cx="62" cy="88" r="20" fill="#F2C14E"/>
    <text x="62" y="94" font-family="Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#2B2B2B" text-anchor="middle">US</text>
    <g transform="translate(58 148) rotate(-10)">
